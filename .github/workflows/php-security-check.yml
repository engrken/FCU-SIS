name: PHP security checks
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: find . -name '*.php' -print0 | xargs -0 -n1 php -l
